<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#0a0f0d 0%,#050807 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .wrap{text-align:center;color:#fff;z-index:10;position:relative}
    .logo{width:88px;height:88px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;border-radius:22px;overflow:hidden;background:rgba(255,255,255,0.06);padding:4px;box-shadow:0 12px 30px rgba(0,0,0,0.5)}
    h1{font-size:30px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em;color:#f8fafc}
    p{font-size:13.5px;color:rgba(255,255,255,0.6);margin-bottom:32px}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:#10B981;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;box-shadow: 0 0 15px rgba(16, 185, 129, 0.3)}
    .status{font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:0.02em;font-weight:500}
    @keyframes spin{to{transform:rotate(360deg)}}
    .orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.12}
    .orb1{width:400px;height:400px;background:#10B981;top:-100px;left:-100px}
    .orb2{width:300px;height:300px;background:#059669;bottom:-80px;right:-80px}
  </style>
  <link rel="manifest" href="/assets/manifest-CKQtQ5T_.json">
  <meta name="theme-color" content="#10B981">
  <link rel="icon" type="image/jpeg" href="/assets/logo-Dj506C6u.jpg">
</head>

      <img src="/assets/logo-Dj506C6u.jpg" alt="Anjani Crop Care" style="width: 100%; height: 100%; object-fit: contain; border-radius: 18px;">
    </div>
    <h1>Anjani ERP</h1>
